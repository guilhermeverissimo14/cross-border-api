spring.application.name=crossborder-api

# Datasource (H2 em memoria)
spring.datasource.url=jdbc:h2:mem:crossborderdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Nao gera o schema a partir das entidades; usa o schema.sql e so valida se bate com as entidades
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#  DevTools liga isso por padrão: o Spring passa a logar toda exceção tratada por @ExceptionHandler
# (duplicando o log do GlobalExceptionHandler e incluindo texto enviado pelo cliente).
spring.mvc.log-resolved-exception=false

# Console web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Health checks: usados como liveness/readiness probe no Kubernetes. Só o /actuator/health é exposto.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
