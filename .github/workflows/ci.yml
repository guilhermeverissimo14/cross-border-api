name: CI

# Roda em todo push na main e em todo pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compila e roda os testes
        run: ./mvnw -B verify

  manifests:
    name: Manifestos Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Renderiza o kustomize e confere o schema (não precisa de cluster).
      - name: Valida os manifestos
        run: |
          kubectl kustomize k8s/ > rendered.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:latest -strict -summary - < rendered.yaml

  docker:
    name: Imagem Docker
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builda a imagem e sobe um container de verdade: garante que o Dockerfile funciona
      # e que a aplicação inicia (readiness) dentro dele.
      - name: Builda a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cross-border-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test do container
        run: |
          docker run -d --name api -p 8080:8080 cross-border-api:ci
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health/readiness; then
              echo; echo "aplicação pronta"; exit 0
            fi
            sleep 2
          done
          echo "a aplicação não ficou pronta a tempo"; docker logs api; exit 1

      # Só publica a imagem em push na main (pull requests apenas validam o build).
      - name: Login no GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da imagem
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Publica a imagem
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
